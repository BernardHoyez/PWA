<script>
var wps=[{"name":"Couche claire et Breaky Bottom","lat":50.04618666666667,"lon":1.331084722222222,"alt":0,"comment":"Une couche claire, c'est-à-dire presque sans silex, est encadrée par deux silex épais. Ces deux silex sont les silex Breaky Bottom.","photo":"photos/photo.jpg"},{"name":"De la marne Round Down à la marne Newpit","lat":50.05803805555555,"lon":1.358501388888889,"alt":0,"comment":"Trois marnes principales ont été ajoutées : la marne Round Down 2, la marne Round Down 3 et la marne du Prêtre.","photo":"photos/photo_01.jpg"},{"name":"De Round Down à Round Down 2","lat":50.05780333333333,"lon":1.3587,"alt":0,"comment":"Une épaisseur toujours de l'ordre de 4,5 mètres","photo":"photos/photo_02.jpg"},{"name":"Entre les marnes Round Down 2 et New Pit","lat":50.05641388888888,"lon":1.354375,"alt":0,"comment":"Dans cette partie supérieure de l'intervalle T 2, apparaissent des niveaux de craie noduleuse ou de hardgrounds blancs. Ces niveaux sont désignés hardgrounds Fileux.","photo":"photos/photo_03.jpg"},{"name":"Entre New Pit 3 et Glynde","lat":50.05432138888889,"lon":1.34966,"alt":0,"comment":"Des craies noduleuses apparaissent au-dessus de la marne New Pit 3","photo":"photos/photo_04.jpg"},{"name":"Eponges ferrugineuses de près","lat":50.05189000000001,"lon":1.343083055555556,"alt":0,"comment":"Le sommet de l'intervalle T 4 est formé de craie noduleuse. Un niveau particulier de hardground à environ 1 mètre sous la marne Southerham est formé de Spongiaires aux parois ferrugineuses.","photo":"photos/photo_05.jpg"},{"name":"HG à éponges ferrugineuses","lat":50.05196138888888,"lon":1.343004722222222,"alt":0,"comment":"Un harground peu épais à éponges ferrugineuses se place à environ 1 mètre sous la marne Southerham","photo":"photos/photo_06.jpg"},{"name":"Intervalle T 4","lat":50.05230277777778,"lon":1.3465975,"alt":0,"comment":"L'intervalle s'étend entre la marne Glynde 1 et la marne Southerham. Les 6 marnes Glynde équidistantes sont caractéristiques. Les silex Camp de César sont assez discrets et mal visibles à distance. Le hardground à éponges ferrugineuses est constant mais sa faible dureté fait qu'il est mal mis en relief. L'épaisseur de l'intervalle est de l'ordre de 8 mètres.","photo":"photos/photo_07.jpg"},{"name":"Intervalle T2 : New Pit à Glynde","lat":50.05554666666666,"lon":1.351603055555556,"alt":0,"comment":"Hormis les deux marnes New Pit 1 et New Pit 2 qui sont très nettes, une troisième marne appelée New Pit 3 a été distinguée.","photo":"photos/photo_08.jpg"},{"name":"Intervalle T5","lat":50.05058,"lon":1.340198333333333,"alt":0,"comment":"L'intervalle T5 entre la marne Southerham et la marne Caburn a une épaisseur réduite d'un peu plus de 1 mètre. Cet intervalle est sans silex. La marne Southerham principale se double d'une marne accessoire, intitulée Southerham 2.","photo":"photos/photo_09.jpg"},{"name":"La marne du Prêtre","lat":50.05554305555556,"lon":1.352258333333333,"alt":0,"comment":"La marne du Prêtre est une simple marne flaser, située à une distance d'environ 1,7 mètres de New Pit 1 (c'est à peu près l'épaisseur de la couche NP1/NP2).","photo":"photos/photo_10.jpg"},{"name":"Le Hardground Gringoria 3/4","lat":50.04995472222221,"lon":1.339003055555555,"alt":0,"comment":"Entre le silex Pollet et la marne Bridgewick 1 se place une masse de harground. Il s'agit de la condensation des hardgrounds Gringoria 3 et 4. Les silex Bridgewick ont été fortement absorbés dans cette condensation et il n'en reste que quelques nodules résiduels.","photo":"photos/photo_11.jpg"},{"name":"Les hardgrounds Gringoria inférieurs","lat":50.05015638888889,"lon":1.339616388888889,"alt":0,"comment":"Entre la marne Caburn et le silex Pollet se placent deux hardgrounds. Il s'agit du hardground Gringoria 1 et du hardground Gringoria 2. Le hardground Gringoria 1 est le plus remarquable : sa surface supérieure est nette, tranchée au couteau. Alors que la surface supérieure du hardground Gringoria 2 est diffuse.","photo":"photos/photo_12.jpg"},{"name":"Les hardgrounds Puys 1","lat":50.04997444444445,"lon":1.339194722222222,"alt":0,"comment":"Ce cliché permet de voir les relations entre marnes, silex et hardgrounds à la base de T sept. Le silex Bopeep 1 est peu apparent entre les marnes Bridgewick 1 et 2. Le silex Bopeep 2 est associé au hardground Puys 1 A et est très peu apparent. Le hardground Puys 1 B se place juste au-dessus du silex Bopeep 3 qui est toujours très bien développé.","photo":"photos/photo_13.jpg"},{"name":"Les hardgrounds Puys 2","lat":50.04802638888888,"lon":1.334625,"alt":0,"comment":"Retenons que le hardgrounds Puys 3 a est un événement caractérisé par sa faune spécifique. Il sert de repère stratigraphique dans d'autres coupes du littoral. A un peu plus de 3 mètres au-dessous, se trouve un autre hardground. Celui-ci est généralement coloré et sa surface supérieure est nette. C'est le hardground Puys 2 a. Il se situe généralement au tiers inférieur de l'intervalle T sept.","photo":"photos/photo_14.jpg"},{"name":"Les hardgrounds Puys supérieurs","lat":50.04627666666666,"lon":1.331129722222222,"alt":0,"comment":"Au-dessus de la couche claire se trouve le hardground Puys 4. Au-dessous de la couche claire se trouve le hardground Puys 3 b. Ce hardground Puys 3 b déborde un peu au-dessus du premier silex Breaky Bottom","photo":"photos/photo_15.jpg"},{"name":"Les silex Bopeep","lat":50.04932666666667,"lon":1.336999722222222,"alt":0,"comment":"Cette vue montre l'intégralité de l'intervalle T sept. La base de cet intervalle est définie par les marnes Bridgewick, ici désignés BR 1 et BR 2. La partie inférieure de l'intervalle T sept est marquée par plusieurs niveaux de silex bien alignés. On les désigne sous le nom de silex Bopeep. Il sont généralement au nombre de cinq. Les hardgrounds Puys 2 recouvrent ces niveaux à silex.","photo":"photos/photo_16.jpg"},{"name":"L'intervalle T 6","lat":50.05019138888889,"lon":1.339751388888889,"alt":0,"comment":"L'intervalle T 6 mesure ici un peu moins de 3 mètres, c'est-à-dire nettement moins qu'à Puys. Il est limité à sa base par la marne Caburn, et à son sommet, par la marne Bridgewick 1. Dans cet intervalle, de tous les silex Bridgewick, il ne subsite qu'un seul niveau bien apparent. Il est désigné silex Pollet. C'est la seule relique des abondants silex que l'on observe plus au Sud. La condensation de l'intervalle s'exprime aussi par des hardgrounds. Ils sont désignés hardgrounds Gringoria.","photo":"photos/photo_17.jpg"},{"name":"Marne du Prêtre et marne New Pit 1","lat":50.05573333333333,"lon":1.352629722222222,"alt":0,"comment":"Au sommet de l'intervalle T 2, les craies sont noduleuses et franchement dures à l'approche de la marne New Pit 1.","photo":"photos/photo_18.jpg"},{"name":"Marne Round Down Gros Plan","lat":50.05771499999999,"lon":1.358798333333333,"alt":0,"comment":"La marne Round Down est assez épaisse, ouverte. Une craie noduleuse avec des nodules ferrugineux la recouvre.","photo":"photos/photo_19.jpg"},{"name":"Partie supérieure de l'intervalle T2","lat":50.05838888888889,"lon":1.360344444444445,"alt":0,"comment":"Entre la marne Round Down et la marne New Pit 1, on remarque 4 blocs séparés par des marnes dont l'épaisseur diminue vers le haut.","photo":"photos/photo_20.jpg"},{"name":"Partie supérieure de l'intervalle T4","lat":50.05191944444444,"lon":1.343111111111111,"alt":0,"comment":"L'éboulement frais montre à la base l'intervalle T4 avec les petits silex Camp de César, le hardground à Spongiaires ferrugineux. Au-dessus de la marne Southerham, l'intervalle T5 a une épaisseur fortement réduite. L'intervalle T6 est bien visible avec ses hardgrounds Gringoria 1 et Gringoria 2, nettement colorés. Le silex Pollet constitue le résidu remarquable et solitaire des silex Bridgewick qui étaient bien développés à Puys.","photo":"photos/photo_21.jpg"},{"name":"Sous la marne Glynde 1","lat":50.05309972222222,"lon":1.345415,"alt":0,"comment":"Une craie noduleuse apparaît sous la marne Glynde 1","photo":"photos/photo_22.jpg"},{"name":"Surface du Hardground Gringoria 1","lat":50.05055500000001,"lon":1.340271666666667,"alt":0,"comment":"La surface nette et tranchée du hardground Gringoria 1 représente une surface de décollement privilégiée. Il est fréquent qu'elle corresponde à un surplomb.","photo":"photos/photo_23.jpg"},{"name":"Surface du HG Gringoria 1 vue de dessus","lat":50.04993333333334,"lon":1.338666388888889,"alt":0,"comment":"Le HG Gringoria 1 possède une surface plate et lisse caractéristique.","photo":"photos/photo_24.jpg"},{"name":"Zoophycos Cuilfail dans bloc éboulé","lat":50.05128499999999,"lon":1.341575,"alt":0,"comment":"Un panneau éboulé montre ce Zoophycos à 50 cm au-dessous du HG Navigation","photo":"photos/photo_25.jpg"}];
