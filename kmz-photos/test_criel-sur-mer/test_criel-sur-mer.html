var wps=[{"name":"Départ","lat":50.0456983,"lon":1.3305833,"alt":18.44,"comment":"Notre coupe commence à l'épi de Mesnil-Val. Descendons l'échelle et marchons quelques mètres.","photo":null},{"name":"Couche claire et Breaky Bottom","lat":50.04569999999999,"lon":1.3306283,"alt":21.06,"comment":"Une couche claire, c'est-à-dire presque sans silex, est encadrée par deux silex épais. Ces deux silex sont les silex Breaky Bottom.","photo":"photos/omimg_20260723_095152_bis.jpg"},{"name":"Les hardgrounds Puys supérieurs","lat":50.04618670000001,"lon":1.331085,"alt":4.53,"comment":"Au-dessus de la couche claire se trouve le hardground Puys 4. Au-dessous de la couche claire se trouve le hardground Puys 3 b. Ce hardground Puys 3 b déborde un peu au-dessus du premier silex Breaky Bottom.","photo":"photos/omimg_20260723_095524_bis.jpg"},{"name":"Les hardgrounds Puys 3","lat":50.04627669999999,"lon":1.33113,"alt":4.51,"comment":"L'intervalle T sept est limité à son sommet par la bentonite Lewes. Deux ensembles de hardgrounds sont représentés à sa partie supérieure. Ils sont séparés par la couche claire et les silex Breaky Bottom. Au sommet, les hardgrounds Puys 4 encadrent les silex tubiformes. Sous le couche claire apparaissent les hardgrounds Puys 3, subdivisés en Puys 3 a et Puys 3 b. Le hardground Puys 3 a est le plus épais et il représente un événement majeur international . C'est l'événement Hitch Wood - Reussianum","photo":"photos/omimg_20260723_095559_bis.jpg"},{"name":"Les hardgrounds Puys 2","lat":50.04800830000001,"lon":1.3346183,"alt":3.25,"comment":"Retenons que le hardgrounds Puys 3 a est un événement caractérisé par sa faune spécifique. Il sert de repère stratigraphique dans d'autres coupes du littoral. A un peu plus de 3 mètres au-dessous, se trouve un autre hardground. Celui-ci est généralement coloré et sa surface supérieure est nette. C'est le hardground Puys 2 a. Il se situe généralement au tiers inférieur de l'intervalle T sept.","photo":"photos/omimg_20260723_101828_bis.jpg"},{"name":"Arrivée","lat":50.0548033,"lon":1.3488883,"alt":3.91,"comment":"C'est ici que la coupe se termine, sur la plage du Tréport.","photo":null}];
